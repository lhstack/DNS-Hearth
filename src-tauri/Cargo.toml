[package]
name = "dns-hearth"
version = "0.0.1"
edition = "2021"
description = "macOS DNS binding and full-featured local DNS proxy"
authors = ["lhstack@foxmail.com"]

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "chrono"] }

# DNS protocol
hickory-proto = "0.25.1"

# QUIC support
quinn = "0.11"

# HTTP/3 support
h3 = { git = "https://github.com/hyperium/h3", branch = "master" }
h3-quinn = { git = "https://github.com/hyperium/h3", branch = "master" }
http = "1.0"
bytes = "1"

# TLS support
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"


# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"


# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Configuration
dotenvy = "0.15"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
async-trait = "0.1"
regex = "1"

# HTTP client for DoH upstream
reqwest = { version = "0.11", features = ["json", "rustls-tls", "stream"], default-features = false }

# TLS root certificates
webpki-roots = "0.26"

# Base64 encoding for DoH
base64 = "0.21"

# X.509 certificate parsing
x509-parser = "0.16"

# Random number generation
rand = "0.8"

# Async utilities
futures = "0.3"
hyper = { version = "1.4", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio-util = "0.7"
dashmap = { version = "6.1.0", features = ["raw-api"] }
tokio-stream = "0.1.18"

tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
urlencoding = "2"
libc = "0.2"

[dev-dependencies]
proptest = "1"
tokio-test = "0.4"
tempfile = "3"

[build-dependencies]
tauri = { version = "2" }
tauri-build = { version = "2", features = [] }

[[bin]]
name = "dns-hearth"
path = "src/main.rs"
